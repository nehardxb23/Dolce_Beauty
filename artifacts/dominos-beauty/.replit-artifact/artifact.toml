kind = "web"
previewPath = "/"
title = "Domino's Beauty"
version = "1.0.0"
id = "artifacts/dominos-beauty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20788

[services.development]
run = "pnpm --filter @workspace/dominos-beauty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dominos-beauty", "run", "build" ]
publicDir = "artifacts/dominos-beauty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20788"
BASE_PATH = "/"
